<!doctype html><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>明日香 · 测试提醒</title><style>body{background:#fff7ed;color:#603b2a;font:15px system-ui;max-width:620px;margin:30px auto;padding:12px}button{background:#f7ddc3;border:1px solid #805140;border-radius:7px;padding:9px;margin:6px}#result{white-space:pre-wrap;line-height:1.6}</style><h1>本机提醒 · 通知验收</h1><p>这是测试提醒，不读取日历、不调用模型，正式事件提醒仍关闭。合成事件约30分钟后开始，约2秒后投递；每轮最多3次系统通知，包含稍后提醒。新气泡提供10分钟后、自定义时间、关闭本次和隐藏。</p><p>提醒需要助手运行。睡眠、关机或退出期间无法保证准时；恢复时仅对逾期不超过10分钟且尚未开始的有效计划补提醒一次。系统日历提醒与助手提醒相互独立。</p><button id="status">检查通知状态</button><button id="authorize">授权系统通知</button><button id="test">合成日程：测试提醒气泡</button><button id="plans">查看合成计划</button><button id="stopplans">结束合成测试</button><button id="clear">关闭本次测试通知</button><p id="result">请先检查状态。没有通知权限时，由你主动授权；不会自动弹权限或发送。</p><script>
const cap=location.hash.slice(1);history.replaceState(null,'',location.pathname);let busy=false;
const labels={authorized:'系统已授权；尚未发送测试通知。',authorization_required:'需要系统通知授权，请主动点击“授权系统通知”。',authorization_pending:'系统授权处理中，请在系统提示中选择后，再点“检查通知状态”。',denied:'系统未允许通知。可在系统设置→通知中检查明日香小助手；本页不会反复申请。',system_accepted:'系统已接受测试通知。请核对屏幕是否实际出现；这不代表你已经看到。点击通知应回到共用聊天气泡中的对应提醒，不重放工具操作。',unknown:'投递结果尚未确定，不自动重发。',unavailable:'原应用通知桥接未就绪，没有自动重试。',cancel_requested:'已请求关闭本次测试通知，不修改任何日历。',nothing_to_clear:'没有本次测试通知。',test_throttled:'测试通知间隔不足，没有再次发送。'};
async function call(action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/notifications/test-channel',{method:'POST',headers:{'Content-Type':'application/json','X-Reminder-Test':cap},body:JSON.stringify({action,explicit:true})});const d=await r.json();document.querySelector('#result').textContent=(d.status==='scheduled'?d.message: d.items ? JSON.stringify(d.items.map(x=>({标题:x.title,状态:x.status,下次时间:x.due})),null,2):null)||labels[d.status]||d.error||'通知操作未完成；没有自动重试。'}catch(e){document.querySelector('#result').textContent='连接未完成，没有自动重试。'}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.getElementById('status').onclick=()=>call('status');document.getElementById('authorize').onclick=()=>call('authorize');document.getElementById('test').onclick=()=>call('synthetic_create');document.getElementById('plans').onclick=()=>call('synthetic_status');document.getElementById('stopplans').onclick=()=>call('synthetic_close_all');document.getElementById('clear').onclick=()=>call('clear_test');
</script>
