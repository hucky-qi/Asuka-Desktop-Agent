const answer=document.querySelector('#answer'),status=document.querySelector('#status'),input=document.querySelector('#input'),send=document.querySelector('#send'),resetButton=document.querySelector('#reset');

async function refreshWebConfig(){try{const c=await fetch('/api/bubble/config',{signal:AbortSignal.timeout(12000)}).then(r=>r.json());const usage=document.querySelector('#usage');usage.textContent=c.usage?c.usage.used+'/'+c.usage.limit:'—';web.disabled=!c.web_configured||!!c.usage?.limit_reached;if(web.disabled){web.checked=false;document.querySelector('.model').textContent='本地 Qwen · 未联网';}modelLabel();web.parentElement.title=!c.web_configured?'百度联网待配置：Key、免费资源和计费状态需确认':c.usage?.limit_reached?'今日上限已达':'百度搜索摘要：仅本次问题，不读取网页正文';usage.title='本助手近24小时请求次数；不是百度官方剩余免费额度'+(c.usage?.limit_reached?'；今日上限已达':'');}catch{document.querySelector('#usage').textContent='—'}}

let recoveryNotice=null,restorePromise=null,preparing=false;let sid=null,epoch=0,active=null,sequence=0,completeTimer=null,sessionInitialized=false,conversationEmpty=null,selectedEdit=null,lastCalendarQuery=null,currentFiles=null,fileResultsReturn=null,fileSelectionBusy=false,memoryReturn=null;
try{sid=sessionStorage.getItem('bubble-session-id')||CalendarDraftStore.read()?.owner||null}catch{}

function safeMessage(value,fallback='操作失败，请稍后重试。'){
 const text=String(value||'');return !text||text.length>350||/Traceback|Bearer|api[_-]?key|token\s*[=:]|\/(?:Users|home|Volumes|tmp)\/|https?:\/\//i.test(text)?fallback:text;
}

function resumeHint(){try{return JSON.parse(sessionStorage.getItem('bubble-resume-hint')||'{}')}catch{return {}}}

try{const d=JSON.parse(sessionStorage.getItem('bubble-draft')||'null');if(d&&Date.now()-d.at<86400000){input.value=d.text;if(d.overflow){const note=document.createElement('p');note.textContent='上次草稿过长，未持久化；当前可见内容不代表完整草稿。';answer.append(note)}}}catch{}
input.addEventListener('input',saveDraft);window.addEventListener('pagehide',saveDraft);
function restoreSession(){if(restorePromise)return restorePromise;restorePromise=restoreSessionOnce().finally(()=>{restorePromise=null});return restorePromise}
async function restoreSessionOnce(){const at=epoch;if(active||resetButton.disabled)return false;try{const r=await post('/api/bubble/session',{session_id:sid,recover:true,resume_hint:resumeHint()});if(epoch!==at||active||resetButton.disabled)return false;const changed=!!sid&&r.session_id!==sid;if(changed){++epoch;selectedEdit=null;lastCalendarQuery=null;currentFiles=null;fileResultsReturn=null;memoryReturn=null;}rememberSession(r.session_id);sessionStatus(r.conversation_empty);selectedEdit=r.calendar_edit||null;if(r.model)applyModel(r.model);if(r.chat_view&&answer.querySelector('.welcome'))renderAnswer(r.chat_view);if(r.file_snapshot&&answer.querySelector('.welcome'))renderFiles(r.file_snapshot);else if(selectedEdit&&answer.querySelector('.welcome'))renderSelectedEdit(selectedEdit);if(r.recovery?.message){notice(r.recovery.message);recoveryNotice=r.recovery.message;}if(CalendarDraftStore.read()){if(answer.querySelector('.welcome'))renderCalendarRecovery(CalendarDraftStore.read());else offerCalendarRecovery(CalendarDraftStore.read());}controls(false);return true}catch(e){if(epoch===at&&!active){notice(safeMessage(e.message,'连接暂不可用，草稿已保留；请稍后发送，不会自动重发。'));}return false}}
window.addEventListener('focus',()=>{if(!active)restoreSession()});document.addEventListener('visibilitychange',()=>{saveDraft();if(!document.hidden&&!active)restoreSession()});

const panelPageID=crypto.randomUUID();window.localFileChatPanelPageID=panelPageID;
function panelEvent(kind,task){globalThis.webkit?.messageHandlers?.bubblePanel?.postMessage({kind,page_id:panelPageID,request_id:task?.id||'',version:kind==='reset'?epoch:(task?.generation??epoch)});}
window.localFileChatTaskState={state:'idle',request_id:null,sequence:0};
function state(value,rid){clearTimeout(completeTimer);const detail={state:value,request_id:rid,sequence:++sequence,at:Date.now()};window.localFileChatTaskState=detail;document.dispatchEvent(new CustomEvent('local-file-chat-task',{detail}));if(value==='complete')completeTimer=setTimeout(()=>state('idle',rid),3000)}
function beginState(rid){sequence=0;state('queued',rid)}
async function post(path,data,signal){const response=await fetch(path,{signal,method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Object.assign(Error(safeMessage(result.error)),{http_status:response.status});return result}
function controls(busy){document.querySelector('#settings').disabled=false;document.querySelector('#model').disabled=false;send.disabled=fileSelectionBusy||(!sessionInitialized&&!busy)||resetButton.disabled||!!(busy&&active?.calendarWrite);send.textContent=busy?(active?.calendarWrite?'核对中':'停止'):'发送';send.setAttribute('aria-label',busy?'停止生成':'发送')}
async function cancel(){const task=active;if(!task)return;if(task.calendarWrite){notice('写入已开始，请等待核对结果，尚不能确认完成。');return;}epoch++;const stoppedEpoch=epoch;active=null;selectedEdit=null;task.controller.abort();controls(false);state('idle',task.id);answer.textContent=data.source_saved?'任务已取消；聊天来源仅保留取消状态和已显示片段。':'任务已取消，未完成的回答未加入对话。';panelEvent('stopped',task);try{const stopped=await post('/api/bubble/cancel',{session_id:sid,request_id:task.id});if(stopped.memory_committed)notice('该次记忆操作已完成；取消不会撤回已保存条目，可在记忆入口核对或忘记。');await restoreSession()}catch(error){if(epoch===stoppedEpoch)notice('停止请求未确认：'+safeMessage(error.message))}}
send.onclick=()=>active?cancel():document.querySelector('form').requestSubmit();
resetButton.onclick=async()=>{const task=active;epoch++;active=null;task?.controller.abort();resetButton.disabled=true;controls(true);state('idle',task?.id||null);try{const result=await post('/api/bubble/reset',{session_id:sid,request_id:task?.id});settingsPane.close();rememberSession(result.session_id);sessionStatus(true);selectedEdit=null;lastCalendarQuery=null;currentFiles=null;fileResultsReturn=null;memoryReturn=null;CalendarDraftStore.clear();renderWelcome();if(result.model)applyModel(result.model);sources.replaceChildren();sources.hidden=true;input.value='';if(task?.calendarWrite)answer.textContent='已确认的日历写入可能仍在进行；请在系统日历核对，勿重复创建。';panelEvent('reset',task)}catch(error){answer.textContent='重置操作失败：'+safeMessage(error.message);panelEvent('error',task)}finally{resetButton.disabled=false;controls(false)}};
async function submitQuestion(override=null,qaContinue=null,newSearch=false){settingsPane.close();const question=override??input.value.trim();if(!question||active||fileSelectionBusy||resetButton.disabled||preparing)return;preparing=true;try{if(!await restoreSession())return;}finally{preparing=false;}if(active||resetButton.disabled)return;const task={id:crypto.randomUUID(),generation:++epoch,controller:new AbortController(),recoveryNotice,webEnabled:web.checked,answerBuffer:'',sourceItems:[]};active=task;recoveryNotice=null;memoryReturn=null;panelEvent('begin',task);beginState(task.id);controls(true);sources.replaceChildren();sources.hidden=true;let first=true;const timeout=setTimeout(()=>{if(active===task)cancel()},65000);
try{const response=await fetch('/api/bubble/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:task.controller.signal,body:JSON.stringify({question,session_id:sid,request_id:task.id,web_enabled:task.webEnabled,web_new_search:newSearch,calendar_edit_id:selectedEdit?.id||null,file_snapshot_id:currentFiles?.snapshot_id||null,qa_continue:qaContinue})});if(!response.ok){const e=await response.json();throw Error(safeMessage(e.error,'操作失败：服务暂不可用，请稍后重试。'))}if(active!==task||epoch!==task.generation)return;sessionStatus(false);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
function receive(data){if(active!==task||epoch!==task.generation||data.request_id!==task.id)return;if(data.persona)PersonaView.set(data.persona);if(data.type==='session'){rememberSession(data.session_id);sessionStatus(data.conversation_empty===true);}if(data.type==='stage'){state(data.state,task.id);}if(data.type==='sources'){task.sourceItems=data.items||[];}if(data.type==='done'&&data.sources){task.sourceItems=data.sources;}if(data.type==='delta'){task.answerBuffer+=data.text;}if(data.type==='error')throw Error(data.error+(data.source_notice?'\n'+data.source_notice:''));if(data.type==='done'){task.completed=true;state(data.state||'idle',task.id);if(data.cancelled){answer.textContent=data.source_saved?'任务已取消；聊天来源仅保留取消状态和已显示片段。':'任务已取消，未完成的回答未加入对话。';panelEvent('stopped',task)}if(!data.cancelled){renderAnswer(data.answer??task.answerBuffer);if(task.recoveryNotice)notice(task.recoveryNotice);if(data.source_notice)notice(data.source_notice);if(data.calendar_edit){selectedEdit=data.calendar_edit;if(!data.calendar_update_preview){renderSelectedEdit(selectedEdit);notice(data.answer||'请补充目标时间。')}}if(data.calendar_events)renderCalendarEvents(data.calendar_events);if(data.calendar_offer)renderCalendarOffer(data.calendar_offer);if(data.calendar_update_selection)renderCalendarUpdateSelection(data.calendar_update_selection);if(data.calendar_update_preview)renderCalendarUpdatePreview(data.calendar_update_preview);if(data.calendar_preview||data.calendar_draft)renderCalendarPreview(data.calendar_preview||data.calendar_draft);if(data.calendar_recovery)renderCalendarRecovery(data.calendar_recovery);else CalendarDraftStore.clear();answer.scrollTop=0;if(task.sourceItems.length){sources.replaceChildren(document.createTextNode('百度搜索摘要 · '));for(const [i,item] of task.sourceItems.entries()){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='['+(i+1)+'] '+item.title;a.title=item.url;sources.appendChild(a)}const fresh=document.createElement('button');fresh.type='button';fresh.textContent='新搜索';fresh.title='输入新问题后点击；普通追问复用现有摘要';fresh.onclick=()=>{if(!input.value.trim()){notice('请输入新搜索问题；当前追问可复用已有摘要。');return;}web.checked=true;submitQuestion(null,null,true)};sources.appendChild(fresh);sources.hidden=false;}if(data.memory_proposal)renderMemoryProposal(data.memory_proposal);if(data.assistant_result?.kind==='files')renderFiles(data.assistant_result.data);if(data.assistant_result?.kind==='file_selection')renderFileSelection(data.assistant_result.data);qaView.render(data.assistant_result);if(data.assistant_result?.kind==='daily_records')memoryUI.renderRecords(data.assistant_result.data);if(input.value.trim()===question)input.value='';panelEvent('ready',task)}}}
while(true){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let index;while((index=buffer.indexOf('\n'))>=0){const line=buffer.slice(0,index);buffer=buffer.slice(index+1);if(line.trim())receive(JSON.parse(line))}if(part.done){if(buffer.trim())receive(JSON.parse(buffer));break}}
if(!task.completed&&active===task&&epoch===task.generation)throw Error('回答连接中断，未收到完整答案');
}catch(error){if(active===task&&epoch===task.generation){state('idle',task.id);currentFiles=null;answer.textContent=safeMessage(error.message,'操作失败：请求未完成，请稍后重试。');panelEvent('error',task)}}finally{clearTimeout(timeout);refreshWebConfig();if(active===task){active=null;controls(false)}}};
document.querySelector('form').onsubmit=event=>{event.preventDefault();return submitQuestion()};
const qaView=createFileQAView({get sid(){return sid},get epoch(){return epoch},get active(){return active},get answer(){return answer},post,renderAnswer,safeMessage,applyModel,resubmit:submitQuestion,returnFiles:()=>{if(fileResultsReturn)renderFiles(fileResultsReturn)}});
function renderAnswer(text){
 currentFiles=null;answer.replaceChildren();
 for(const line of String(text).split('\n')){
  const row=document.createElement('div');let at=0;const pattern=/\*\*([^*\n]+)\*\*|\*([^*\n]+)\*/g;
  for(const m of line.matchAll(pattern)){row.appendChild(document.createTextNode(line.slice(at,m.index)));const e=document.createElement(m[1]?'strong':'em');e.textContent=m[1]||m[2];row.appendChild(e);at=m.index+m[0].length}
  row.appendChild(document.createTextNode(line.slice(at)));if(!line)row.appendChild(document.createElement('br'));answer.appendChild(row);
 }
}
function renderWelcome(){answer.replaceChildren();const box=document.createElement('div');PersonaView.welcome(box);answer.append(box);}

function renderFileSelection(data){renderAnswer(data.message||'已选择文件，尚未打开。');const p=document.createElement('p');p.textContent=(data.qa_files||[data.selected]).map(f=>f.name).join(' + ');answer.append(p);if(fileResultsReturn){const b=document.createElement('button');b.type='button';b.textContent='返回文件列表';b.onclick=()=>{if(!active)renderFiles(fileResultsReturn)};answer.append(b)}}
function renderFiles(data){
 currentFiles=data;fileResultsReturn=data;answer.replaceChildren();const box=document.createElement('div');box.className='calendar-preview file-results';box.dataset.fileSnapshot=data.snapshot_id;const at=epoch;
 const line=text=>{const p=document.createElement('p');p.textContent=text;box.append(p)};
 PersonaView.search(box,data);
 for(const file of data.files){const row=document.createElement('div');row.className='calendar-event file-card';row.dataset.fileId=file.file_id;const title=document.createElement('div');title.textContent=file.name;row.append(title);const evidence=document.createElement('small');evidence.textContent=file.evidence_source||'名称／目录及已有索引依据';row.append(evidence);const choose=document.createElement('button');choose.type='button';choose.textContent='选择';choose.onclick=async()=>{if(active||fileSelectionBusy||epoch!==at||currentFiles?.snapshot_id!==data.snapshot_id)return;fileSelectionBusy=true;controls(false);try{const r=await post('/api/bubble/files/select',{session_id:sid,snapshot_id:data.snapshot_id,card_token:file.card_token});if(epoch===at&&currentFiles?.snapshot_id===data.snapshot_id)renderFileSelection(r.assistant_result.data)}catch(e){if(epoch===at)notice(e.message)}finally{fileSelectionBusy=false;controls(!!active)}};row.append(choose);const compare=document.createElement('button');compare.type='button';compare.textContent='加入对比';compare.onclick=async()=>{if(active||fileSelectionBusy||epoch!==at||currentFiles?.snapshot_id!==data.snapshot_id)return;fileSelectionBusy=true;controls(false);try{const r=await post('/api/bubble/files/select',{session_id:sid,snapshot_id:data.snapshot_id,card_token:file.card_token,add_to_compare:true});if(epoch===at)renderFileSelection(r.assistant_result.data)}catch(e){if(epoch===at)notice(e.message)}finally{fileSelectionBusy=false;controls(!!active)}};row.append(compare);box.append(row)}
 const link=document.createElement('a');link.textContent='完整文件助手';link.target='_blank';link.rel='noopener';link.setAttribute('aria-disabled','true');box.append(link);answer.append(box);
