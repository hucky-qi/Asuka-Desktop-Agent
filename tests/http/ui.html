<!doctype html><meta charset="utf-8"><title>黑盒回归 · 隔离HTTP依赖</title>
<style>body{font:14px system-ui;background:#fffaf5;color:#302b29}iframe{width:360px;height:300px;border:1px solid #aaa}#file{width:900px;height:620px}pre{white-space:pre-wrap}.pass{color:#176333}.fail{color:#a32020}</style>
<h1>黑盒界面基线：模拟依赖，非百度真实请求</h1><p>仅操作页面公开DOM、按键与表单；合成IME不等于系统输入法。原生窗口互斥/菜单另列覆盖缺口。</p><pre id="log"></pre><iframe id="bubble" src="/app/bubble"></iframe><iframe id="file" src="/app/"></iframe>
<script>
const rows=[],log=document.querySelector('#log'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(fn,ms=15000)=>{let end=Date.now()+ms;while(Date.now()<end){if(await fn())return;await sleep(40)}throw Error('visible/network condition timeout')};
const obs=async()=> (await(await fetch('/observations')).json()).calls;
const sends=async()=> (await obs()).filter(x=>x.path==='UI:/api/bubble/chat').length;
async function test(name,fn){let t=performance.now();try{let evidence=await fn();rows.push({case:name,status:'PASS',ms:Math.round(performance.now()-t),evidence})}catch(e){rows.push({case:name,status:'FAIL',error:String(e)})}log.textContent=JSON.stringify(rows,null,2)}
const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
(async()=>{
 await until(()=>document.querySelector('#bubble').contentDocument?.querySelector('#input')&&document.querySelector('#file').contentDocument?.querySelector('#question'));
 const bubble=document.querySelector('#bubble'),doc=bubble.contentDocument,w=bubble.contentWindow,input=doc.querySelector('#input'),send=doc.querySelector('#send'),reset=doc.querySelector('#reset');
 await test('web_default_off_toggle_zero_request',async()=>{assert(!doc.querySelector('#web').checked,'default checkbox on');await until(()=>!doc.querySelector('#web').disabled);let before=(await obs()).filter(x=>x.path==='/web_search').length;doc.querySelector('#web').click();assert(doc.querySelector('#web').checked,'checkbox could not be enabled');doc.querySelector('#web').click();assert(!doc.querySelector('#web').checked,'checkbox could not be disabled');await sleep(120);assert((await obs()).filter(x=>x.path==='/web_search').length===before,'toggle sent web request');return{checked:false,search_requests:0}});
 await test('synthetic_ime_enter_space_digit_no_send',async()=>{
  let before=await sends();input.value='黑盒中文草稿';input.dispatchEvent(new w.CompositionEvent('compositionstart',{bubbles:true}));
  for(let key of ['Enter',' ','1']){input.dispatchEvent(new w.KeyboardEvent('keydown',{key,keyCode:key==='Enter'?229:0,isComposing:true,bubbles:true,cancelable:true}));input.dispatchEvent(new w.KeyboardEvent('keyup',{key,bubbles:true}))}
  input.dispatchEvent(new w.CompositionEvent('compositionend',{bubbles:true}));input.dispatchEvent(new w.CompositionEvent('compositionstart',{bubbles:true}));input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',keyCode:229,isComposing:true,bubbles:true,cancelable:true}));input.dispatchEvent(new w.CompositionEvent('compositionend',{bubbles:true}));doc.querySelector('form').dispatchEvent(new w.SubmitEvent('submit',{bubbles:true,cancelable:true}));input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));doc.querySelector('form').dispatchEvent(new w.SubmitEvent('submit',{bubbles:true,cancelable:true}));input.dispatchEvent(new w.KeyboardEvent('keyup',{key:'Enter',bubbles:true}));input.dispatchEvent(new w.InputEvent('input',{bubbles:true}));input.dispatchEvent(new w.Event('change',{bubbles:true}));input.dispatchEvent(new w.FocusEvent('blur',{bubbles:true}));await sleep(150);assert(await sends()===before,'composition submitted');return{before,after:await sends(),coverage:'synthetic browser only'}
 });
 await test('explicit_send_once_atomic_answer',async()=>{let before=await sends();input.value='慢速解释RAG';input.dispatchEvent(new w.InputEvent('input',{bubbles:true}));send.click();input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',repeat:true,bubbles:true,cancelable:true}));await until(async()=>await sends()>before);await sleep(300);assert(!doc.querySelector('#answer').textContent.includes('检索与生成'),'partial new answer visible');await until(()=>send.getAttribute('aria-label')==='发送');assert(await sends()===before+1,'duplicate submit');assert(doc.querySelector('#answer').textContent.length>0,'no answer');return{requests:1,answer_once:true}});
 await test('draft_hide_restore_browser_document',async()=>{input.value='保留草稿blackbox';input.dispatchEvent(new w.InputEvent('input',{bubbles:true}));let answer=doc.querySelector('#answer').textContent;bubble.style.display='none';await sleep(100);bubble.style.display='';assert(input.value==='保留草稿blackbox','draft lost');assert(doc.querySelector('#answer').textContent===answer,'answer lost');return{coverage:'retained browser document; not native panel automation'}});
 await test('reset_while_generating_no_late_answer',async()=>{input.value='慢速解释RAG';input.dispatchEvent(new w.InputEvent('input',{bubbles:true}));send.click();await until(()=>send.getAttribute('aria-label')==='停止生成');reset.click();await sleep(2800);assert(doc.querySelector('#answer').textContent==='','stale answer returned after reset');assert(input.value==='','reset did not clear input');return{late_answer:false}});
 const fd=document.querySelector('#file').contentDocument,fw=document.querySelector('#file').contentWindow;
 await test('natural_to_advanced_shared_results_counts',async()=>{
  let q=fd.querySelector('#question');q.value='找一下野餐清单';q.dispatchEvent(new fw.Event('input',{bubbles:true}));fd.querySelector('#send').click();await until(()=>!fd.querySelector('#send').disabled,45000);let before=fd.body.textContent;assert(before.includes('野餐清单.pdf'),'natural query missing fixture');
  fd.querySelector('#navFiles').click();assert(fd.querySelector('#fileSearchForm').getBoundingClientRect().height>0,'advanced form invisible');assert(fd.body.textContent.includes('野餐清单.pdf'),'switch lost results');fd.querySelector('#fileTypes').value='pdf';fd.querySelector('#fileSearchForm').requestSubmit();await until(()=>!fd.querySelector('#fileSearchSubmit').disabled,45000);fd.querySelector('#navChat').click();assert(fd.body.textContent.includes('野餐清单.pdf'),'filter lost result');return{same_result_after_switch:true}
 });
 await fetch('/ui-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({results:rows,not_covered:['native panel visibility/order','native right menu stop','native drag/singleton','system IME']})});
})();
</script>
